# SENTINEL CI — enforces the CLAUDE.md §7 Definition of Done on every change.
# Job 1 (check): the fast gate — lint, format, mypy --strict, unit tests + the
#   80% coverage gate (no Foundry needed). Job 2 (integration): the real
#   sandbox — Foundry + Anvil, running the integration + golden-trace suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · types · unit + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: make check
        run: make check

  integration:
    name: Integration (real Anvil sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Foundry (anvil / forge / cast)
        uses: foundry-rs/foundry-toolchain@v1
      - name: Sync dependencies
        run: uv sync
      - name: Integration + golden-trace suite
        run: uv run pytest -m integration
