[project]
name = "sentinel"
version = "0.1.0"
description = "SENTINEL — a multi-agent War Room that audits smart contracts with real simulation data, institutional memory, and a blocking human checkpoint."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "structlog>=24.1",
    "web3>=6.0",
    "mcp>=1.2",
    "sqlite-vec>=0.1.6",
    "openai>=1.30",
    "rich>=13.7",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

# --- ruff: lint + format (replaces black/isort/flake8) -----------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D"]
# D203/D213 conflict with the Google convention enabled below.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through names; package markers need no docstring.
"tests/**" = ["D"]
"**/__init__.py" = ["D104"]

# --- mypy: strict on all shipped source --------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sentinel"]
plugins = ["pydantic.mypy"]

# Third-party libs without strict-friendly stubs: treat as Any so our own code
# still type-checks under --strict (we launder their return values into typed
# values explicitly at the boundary).
[[tool.mypy.overrides]]
module = ["web3", "web3.*", "eth_account.*", "eth_typing.*", "hexbytes.*", "mcp", "mcp.*", "fastmcp.*", "sqlite_vec", "openai", "openai.*"]
ignore_missing_imports = true
follow_imports = "skip"

# --- pytest: unit by default, integration behind a marker --------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
# Put the repo root on sys.path so the golden-trace test can import the demo
# harness (``demo/`` is a namespace package run as ``python -m demo.run_demo``,
# not part of the installed ``sentinel`` distribution).
pythonpath = ["."]
markers = [
    "integration: slow tests requiring a real Anvil sandbox (run via `make check-integration`)",
]

# --- coverage: CLAUDE.md §6 target is 80%+ on orchestrator/ + agents/ ---------
[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
